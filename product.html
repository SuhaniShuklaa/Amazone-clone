<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone - Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #e3e6e6;
            color: #0f1111;
        }

        .navbar {
            background-color: #131921;
            color: white;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar h2 {
            color: #ff9900;
        }

        .page-heading {
            padding: 25px 5% 10px;
        }

        .page-heading p {
            margin-top: 8px;
            color: #565959;
        }

        .category-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 15px 5%;
        }

        .category-bar button {
            padding: 9px 14px;
            border: 1px solid #aaa;
            border-radius: 20px;
            background: white;
            cursor: pointer;
        }

        .category-bar button:hover {
            background: #ffd814;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            padding: 15px 5% 35px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card img {
            width: 100%;
            height: 190px;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 17px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .product-card button {
            background: #ffd814;
            border: none;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: auto;
        }

        .product-card button:hover {
            background: #f7ca00;
        }

        .empty-message {
            padding: 25px 5%;
            display: none;
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                padding: 10px;
            }

            .product-card {
                padding: 10px;
            }

            .product-card img {
                height: 130px;
            }

            .product-card h3 {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html"><h2>amazon</h2></a>
        <a href="index.html">Home</a>
        <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
    </nav>

    <div class="page-heading">
        <h1 id="page-title">All Products</h1>
        <p>Explore our collection and add your favourite items to the cart.</p>
    </div>

    <div class="category-bar">
        <button onclick="showCategory('All')">All</button>
        <button onclick="showCategory('Clothes')">Clothes</button>
        <button onclick="showCategory('Health & Personal Care')">Health & Care</button>
        <button onclick="showCategory('Furniture')">Furniture</button>
        <button onclick="showCategory('Electronics')">Electronics</button>
        <button onclick="showCategory('Beauty Products')">Beauty</button>
        <button onclick="showCategory('Animal Care')">Animal Care</button>
        <button onclick="showCategory('Toys')">Toys</button>
        <button onclick="showCategory('dresses')">Dresses</button>
    </div>

    <main class="products" id="products-container"></main>

    <p class="empty-message" id="empty-message">
        No products found in this category.
    </p>

    <script>
        const products = [
            { id: 1, name: "Casual T-Shirt", price: 499, category: "Clothes", image: "box1_image.jpg" },
            { id: 2, name: "Everyday Clothing", price: 699, category: "Clothes", image: "box1_image.jpg" },

            { id: 3, name: "Personal Care Kit", price: 299, category: "Health & Personal Care", image: "box2_image.jpg" },
            { id: 4, name: "Daily Care Essentials", price: 399, category: "Health & Personal Care", image: "box2_image.jpg" },

            { id: 5, name: "Home Furniture", price: 2499, category: "Furniture", image: "box3_image.jpg" },
            { id: 6, name: "Modern Home Decor", price: 999, category: "Furniture", image: "box3_image.jpg" },

            { id: 7, name: "Electronic Gadget", price: 1499, category: "Electronics", image: "box4_image.jpg" },
            { id: 8, name: "Smart Accessories", price: 799, category: "Electronics", image: "box4_image.jpg" },

            { id: 9, name: "Beauty Essentials", price: 349, category: "Beauty Products", image: "box5_image.jpg" },
            { id: 10, name: "Beauty Care Kit", price: 599, category: "Beauty Products", image: "box5_image.jpg" },

            { id: 11, name: "Animal Care Essentials", price: 399, category: "Animal Care", image: "box6_image.jpg" },
            { id: 12, name: "Pet Care Kit", price: 549, category: "Animal Care", image: "box6_image.jpg" },

            { id: 13, name: "Kids Toy Set", price: 499, category: "Toys", image: "box7_image.jpg" },
            { id: 14, name: "Fun Play Toy", price: 299, category: "Toys", image: "box7_image.jpg" },

            { id: 15, name: "Casual Dress", price: 899, category: "dresses", image: "box8_image.jpg" },
            { id: 16, name: "Party Dress", price: 1299, category: "dresses", image: "box8_image.jpg" }
        ];

        const container = document.getElementById("products-container");
        const pageTitle = document.getElementById("page-title");
        const emptyMessage = document.getElementById("empty-message");

        function getCart() {
            return JSON.parse(localStorage.getItem("amazonCart") || "[]");
        }

        function updateCartCount() {
            const cart = getCart();
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById("cart-count").textContent = count;
        }

        function displayProducts(category = "All") {
            container.innerHTML = "";

            const filteredProducts = category === "All"
                ? products
                : products.filter(product =>
                    product.category.toLowerCase() === category.toLowerCase()
                );

            pageTitle.textContent = category === "All"
                ? "All Products"
                : category;

            emptyMessage.style.display =
                filteredProducts.length === 0 ? "block" : "none";

            filteredProducts.forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";

                const image = document.createElement("img");
                image.src = product.image;
                image.alt = product.name;

                image.onerror = function () {
                    this.style.display = "none";
                };

                const name = document.createElement("h3");
                name.textContent = product.name;

                const categoryText = document.createElement("p");
                categoryText.textContent = product.category;

                const price = document.createElement("p");
                price.className = "price";
                price.textContent = "₹" + product.price.toLocaleString("en-IN");

                const button = document.createElement("button");
                button.textContent = "Add to Cart";

                button.addEventListener("click", function () {
                    addToCart(product);
                });

                card.append(image, name, categoryText, price, button);
                container.appendChild(card);
            });
        }

        function showCategory(category) {
            displayProducts(category);

            const url = new URL(window.location.href);

            if (category === "All") {
                url.searchParams.delete("category");
            } else {
                url.searchParams.set("category", category);
            }

            history.replaceState({}, "", url);
        }

        function addToCart(product) {
            const cart = getCart();
            const existingItem = cart.find(item => item.id === product.id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }

            localStorage.setItem("amazonCart", JSON.stringify(cart));
            updateCartCount();

            alert(product.name + " added to cart!");
        }

        const selectedCategory =
            new URLSearchParams(window.location.search).get("category") || "All";

        displayProducts(selectedCategory);
        updateCartCount();
    </script>

</body>
</html>
